<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>家长面板 - 益智游戏</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/parent.css">
</head>
<body>
  <div class="parent-container">
    <!-- 验证入口 -->
    <div id="parent-verify" class="parent-verify">
      <div class="verify-content">
        <h2>家长验证</h2>
        <p>请计算下面的题目:</p>
        <div id="verify-question" class="verify-question">
          <!-- 验证题目 -->
        </div>
        <input type="number" id="verify-answer" class="verify-input" placeholder="输入答案">
        <div class="verify-actions">
          <button id="verify-cancel" class="btn-secondary">取消</button>
          <button id="verify-confirm" class="btn-primary">确认</button>
        </div>
      </div>
    </div>

    <!-- 家长面板内容 -->
    <div id="parent-content" class="parent-content hidden">
      <div class="parent-header">
        <button id="back-to-game" class="back-btn">← 返回</button>
        <h1>家长面板</h1>
      </div>

      <!-- 统计总览 -->
      <div class="stats-overview">
        <h2>学习统计</h2>
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-icon">⭐</div>
            <div class="stat-info">
              <div class="stat-value" id="parent-total-stars">0</div>
              <div class="stat-label">总星星数</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon">✅</div>
            <div class="stat-info">
              <div class="stat-value" id="parent-completed-levels">0</div>
              <div class="stat-label">已完成关卡</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon">🎯</div>
            <div class="stat-info">
              <div class="stat-value" id="parent-accuracy">0%</div>
              <div class="stat-label">平均正确率</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon">📅</div>
            <div class="stat-info">
              <div class="stat-value" id="parent-total-plays">0</div>
              <div class="stat-label">总游玩次数</div>
            </div>
          </div>
        </div>
      </div>

      <!-- 关卡详情 -->
      <div class="level-details">
        <h2>关卡详情</h2>
        <div id="level-list" class="level-list">
          <!-- 关卡列表由JS动态生成 -->
        </div>
      </div>

      <!-- 最近游玩记录 -->
      <div class="recent-plays">
        <h2>最近游玩</h2>
        <div id="recent-plays-list" class="recent-plays-list">
          <!-- 最近记录由JS动态生成 -->
        </div>
      </div>

      <!-- 管理功能 -->
      <div class="management">
        <h2>管理功能</h2>
        <div class="management-actions">
          <button id="reset-color-levels" class="btn-warning">
            🔄 重置颜色星球进度
          </button>
          <button id="reset-all" class="btn-danger">
            ⚠️ 重置全部进度
          </button>
        </div>
        <div class="warning-text">
          <p>⚠️ 重要提醒:</p>
          <p>进度保存在浏览器本地存储中。清理浏览器缓存会清空所有星星记录!</p>
        </div>
      </div>

      <!-- 设置 -->
      <div class="settings">
        <h2>设置</h2>
        <div class="setting-item">
          <label>音效</label>
          <div class="setting-control">
            <input type="checkbox" id="audio-toggle" checked>
            <span>开启音效</span>
          </div>
        </div>
        <div class="setting-item">
          <label>音量</label>
          <div class="setting-control">
            <input type="range" id="volume-slider" min="0" max="100" value="80">
            <span id="volume-value">80%</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/parent.js"></script>
</body>
</html>
